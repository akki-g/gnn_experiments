# Pursuit environment MAPPO config — symmetric learnable smoke default (alpha=1.0).
#
# alpha=1.0 means ALL agents (both full-sight and sensor-limited) see the full
# world radius → symmetric baseline. Use this to confirm the backbone learns
# the pursuit task before running alpha-sweep ablations.
#
# MODE A constraint (LOCKSTEP fixed-length episodes):
#   runtime.rollout_length MUST equal env.max_steps.
#   Both are set to 100 here.
#   (The trainer enforces: rollout_length == max_steps assertion.)
#
# Minibatch constraint:
#   rollout_length * num_envs % num_minibatches == 0
#   100 * 32 = 3200; 3200 / 1 = 3200 — satisfied.
#
# Privileged critic state (CTDE):
#   state = [pursuer_pos flat (N*2), target_pos (2), t_norm (1)]
#   state_dim = 3*2 + 2 + 1 = 9   (for num_agents=3, include_timestep=true)
#   The critic ALWAYS sees the true target regardless of alpha.
#
# Comm slot: IdentityComm (Phase 2 — no real communication).

algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 2000000
  checkpoint_interval: 20
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

comm:
  module: "identity"

env:
  name: "pursuit"
  kind: "pursuit"
  num_agents: 5
  max_steps: 100
  include_timestep_in_state: true

  # Observation asymmetry knob (Phase 2 focus):
  alpha: 1.0              # 1.0 = symmetric (all agents full-sight); 0.0 = fully blind
  num_full_sight: 1       # first 2 agents are class 0 (full-sight)
  observe_teammates: false # no teammate positions in local obs (isolation guarantee)

  # World geometry:
  world_size: 5.0
  capture_radius: 0.1
  move_step: 0.05
  target_speed: 0.03

  # Reward coefficients:
  dist_coef: 1.0
  step_penalty: 0.01
  capture_bonus: 10.0

  # Trainer diagnostics — key names MUST match info dict keys from PursuitEnv:
  primary_diagnostic: "pursuer_target_distance"
  secondary_diagnostic: "capture"
  task_score_kind: "pursuit"

logging:
  log_dir: "runs/pursuit"
  run_label: "pursuit_alpha1"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 1

render:
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
