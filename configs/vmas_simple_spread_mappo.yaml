# VMAS simple_spread MAPPO config.
#
# For a ~1-minute local sanity run, set:
#   runtime.num_envs=4, runtime.total_env_steps=20000, model.hidden_dim=32
#
# Constraint: rollout_length * num_envs must be divisible by algo.num_minibatches.
#   100 * 32 = 3200; 3200 / 1 = 3200 — satisfied.
#
# GPU note: set_seed() enables cudnn.deterministic=True for reproducibility.
# For this pure-MLP backbone there are no convolutions so the speed impact is
# negligible. If profiling shows a bottleneck, you can disable it in utils.py.
#
# Logged metric notes:
#   grad_norm       : PRE-clip L2 norm (actual applied grads are clipped to max_grad_norm)
#   value_loss      : raw MSE before value_coef scaling (total_loss applies the weight)
#   approx_kl       : 0.5 * E[(log r)²] approximation, not the Schulman estimator
#   mean_ratio_epoch0: first minibatch of epoch 0 only; should be ≈ 1.0
#   lr              : linearly annealed from lr to lr_final
#   reward_shift    : added only to PPO optimization reward; raw reward still logged
#   entropy_coef    : linearly annealed from entropy_coef to entropy_coef_final
#                     to keep early exploration while encouraging late exploitation
#   *_gap_to_zero   : remaining positive distance from raw non-positive reward to 0
#   *_delta_from_start: positive means improvement over this run's first metric
#   eval_*          : deterministic greedy-policy no-video evaluation metrics
#   coverage_distance/collision_pairs: direct simple_spread task diagnostics
#   task_score      : positive bounded diagnostic from coverage/collisions; not reward

algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 2000000
  checkpoint_interval: 20
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

comm:
  module: "identity"

env:
  name: "vmas_simple_spread"
  scenario: "simple_spread"
  num_agents: 3
  max_steps: 100
  include_timestep_in_state: true

logging:
  log_dir: "runs/vmas_simple_spread"
  run_label: "entropy_anneal"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 1

render:
  # Batch/HPC default: no VMAS/pyglet rendering on headless compute nodes.
  # Use --render on or experiments.render_trained_policy when video is needed.
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
