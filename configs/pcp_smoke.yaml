# PCP (Predator-Capture-Prey) smoke-test config.
#
# Derived from configs/pursuit_stiffened.yaml (model/algo/comm/log structure preserved).
# PCP-specific changes vs pursuit_stiffened:
#   env.kind          : pcp            (PCPEnv instead of PursuitEnv)
#   env.alpha         : 0.0            (capturer hard-blindness — REQUIRED by PCP)
#   env.target_speed  : 0.0            (stationary prey — REQUIRED by PCP)
#   env.num_full_sight: 3              (3 detectors; remaining 2 are capturers)
#   env.capture_k     : 1              (1 capturer within capture_radius sufficient)
#   env.detect_radius : 2.0            (detector fires detection event within this range)
#   env.detection_window: 5            (window open for 5 steps after last detection)
#   env.dist_coef     : 0.1            (Scheme B: detector-only dense term, 10x weaker)
#
# "Smoke" here = SMALL GRID (5 cells x 3 seeds), NOT a tiny step budget. Each cell
# runs the full 2M-step budget (matches pursuit_stiffened) so detectors can actually
# learn to find the prey and the comm-necessity decision (section 6) is evaluable.
# For a fast LOCAL end-to-end check, copy this file and shrink runtime.total_env_steps
# (the entrypoint has no per-key CLI override; only --config/--seed/--resume/--render).
# MODE A constraint: runtime.rollout_length == env.max_steps (both 100).
# Minibatch constraint: 100 * 32 % 1 == 0.

algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 2000000  # full budget (matches pursuit_stiffened); 5x3 grid is the "smoke"
  checkpoint_interval: 20
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

# Comm slot — overridden per-cell by the sbatch sweep.
comm:
  module: "identity"
  topology: "knn"
  knn_k: 4
  symmetrize: "or"
  zero_messages: false

env:
  name: "pcp"
  kind: "pcp"
  num_agents: 5
  num_full_sight: 3        # 3 detectors (class 0), 2 capturers (class 1)
  alpha: 0.0               # REQUIRED: capturer hard-blindness
  target_speed: 0.0        # REQUIRED: stationary prey
  max_steps: 100
  include_timestep_in_state: true

  # Observation isolation guarantee
  observe_teammates: false

  # World geometry
  world_size: 12.0
  move_step: 0.2
  capture_radius: 0.6
  capture_k: 1             # 1 class-1 capturer within capture_radius suffices

  # PCP-specific: detection mechanism
  detect_radius: 2.0
  detection_window: 5      # window open for 5 steps after last detection event

  # Reward coefficients (Scheme B)
  dist_coef: 0.1           # detector-only dense term, 10x weaker than pursuit_base
  step_penalty: 0.01
  capture_bonus: 10.0

  # Trainer diagnostics (key names match PCPEnv info dict via parent PursuitEnv)
  primary_diagnostic: "pursuer_target_distance"
  secondary_diagnostic: "capture"
  task_score_kind: "pursuit"

logging:
  log_dir: "runs/pcp_smoke"
  run_label: "pcp_smoke_default"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 1
  save_checkpoints: true

render:
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
