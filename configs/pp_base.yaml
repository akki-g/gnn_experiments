# PP = homogeneous predator-prey, pure-YAML pursuit variant (no new Python).
#
# This is a homogeneous predator-prey variant of the pursuit environment:
#   - All agents are class-1 (sensor-limited): num_full_sight=0 => no class-0 agents.
#   - Moving prey: target_speed=0.05 (non-trivial random-walk prey).
#   - Coalition capture: capture_k=5 (all 5 agents must be within capture_radius).
#   - Observation asymmetry: alpha=0.5 (from pursuit_base.yaml).
#   - Homogeneous: no privileged full-sight agents.
#
# No new Python required — uses env.kind="pursuit" and the existing PursuitAdapter.
# Differences from pursuit_base.yaml:
#   num_full_sight : 3     -> 0      (homogeneous, no detectors)
#   capture_k      : 4     -> 5      (requires all 5 agents)
#   target_speed   : 0.05  (same as pursuit_base.yaml)
#   alpha          : 0.5   (from pursuit_base.yaml)
#
# MODE A constraint: runtime.rollout_length == env.max_steps (both 100).

algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 2000000
  checkpoint_interval: 20
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

comm:
  module: "identity"
  topology: "knn"
  knn_k: 4
  symmetrize: "or"
  zero_messages: false

env:
  name: "pursuit"
  kind: "pursuit"
  num_agents: 5
  num_full_sight: 0           # homogeneous: no privileged full-sight agents
  alpha: 0.5                  # limited-vision (reused from pursuit_base.yaml)
  target_speed: 0.05          # moving prey (same as pursuit_base.yaml)
  max_steps: 100
  include_timestep_in_state: true

  # Observation isolation guarantee
  observe_teammates: false

  # World geometry
  world_size: 12.0
  capture_radius: 0.5
  capture_k: 5               # require all 5 agents within capture_radius
  move_step: 0.2

  # Reward coefficients
  dist_coef: 1.0
  step_penalty: 0.01
  capture_bonus: 10.0

  # Trainer diagnostics
  primary_diagnostic: "pursuer_target_distance"
  secondary_diagnostic: "capture"
  task_score_kind: "pursuit"

logging:
  log_dir: "runs/pp_base"
  run_label: "pp_base_default"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 1
  save_checkpoints: true

render:
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
