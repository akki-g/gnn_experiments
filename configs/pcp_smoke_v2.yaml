# PCP (Predator-Capture-Prey) smoke-test config — v2 (eased capture).
#
# Iteration on configs/pcp_smoke.yaml after the first smoke sweep + probe:
#   - Probe confirmed the comm channel CARRIES prey location to blind capturers
#     (R2_post: broadcast 0.86 / attention 0.76 vs _zm ~0.22, raw ~0.10).
#   - But eval_capture was ~0 for ALL cells: capturers could not convert the
#     relayed signal into capture behavior because capture_radius=0.6 was too
#     tight to hit reliably -> reward too sparse to bootstrap.
#
# v2 changes (make capture LEARNABLE without reintroducing free-riding):
#   - env.capture_radius   : 0.6 -> 1.0  (still < detect_radius=2.0; probe shows
#                            uninformed/_zm capturers have no prey info, so a larger
#                            radius helps INFORMED capturers disproportionately).
#   - algo.entropy_coef_final: 0.001 -> 0.01 (constant entropy floor) so capturers
#                            keep exploring long enough to experience in-window
#                            captures and bootstrap the policy before entropy collapses.
# Everything else identical to pcp_smoke.yaml (detect_radius=2.0, T=5, etc.).
#
# "Smoke" = SMALL GRID (5 cells x 3 seeds), full 2M-step budget per cell.
# MODE A constraint: runtime.rollout_length == env.max_steps (both 100).

algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.01    # v2: entropy floor (was 0.001) — keep capturers exploring
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 2000000  # full budget (matches pursuit_stiffened); 5x3 grid is the "smoke"
  checkpoint_interval: 20
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

# Comm slot — overridden per-cell by the sbatch sweep.
comm:
  module: "identity"
  topology: "knn"
  knn_k: 4
  symmetrize: "or"
  zero_messages: false

env:
  name: "pcp"
  kind: "pcp"
  num_agents: 5
  num_full_sight: 3        # 3 detectors (class 0), 2 capturers (class 1)
  alpha: 0.0               # REQUIRED: capturer hard-blindness
  target_speed: 0.0        # REQUIRED: stationary prey
  max_steps: 100
  include_timestep_in_state: true

  # Observation isolation guarantee
  observe_teammates: false

  # World geometry
  world_size: 12.0
  move_step: 0.2
  capture_radius: 1.0      # v2: eased from 0.6 (still < detect_radius=2.0)
  capture_k: 1             # 1 class-1 capturer within capture_radius suffices

  # PCP-specific: detection mechanism
  detect_radius: 2.0
  detection_window: 5      # window open for 5 steps after last detection event

  # Reward coefficients (Scheme B)
  dist_coef: 0.1           # detector-only dense term, 10x weaker than pursuit_base
  step_penalty: 0.01
  capture_bonus: 10.0

  # Trainer diagnostics (key names match PCPEnv info dict via parent PursuitEnv)
  primary_diagnostic: "pursuer_target_distance"
  secondary_diagnostic: "capture"
  task_score_kind: "pursuit"

logging:
  log_dir: "runs/pcp_smoke_v2"
  run_label: "pcp_smoke_v2_default"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 1
  save_checkpoints: true

render:
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
