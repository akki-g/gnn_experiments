# Pursuit env — STIFFENED communication-necessity sanity sweep.
#
# Delta vs configs/pursuit_base.yaml (the comm-trivial config used by the
# 175-run sweep in runs/pursuit_20260608_220631):
#
#   num_full_sight : 3   -> 0       (no privileged pursuers; remove the
#                                    "3 see all targets" cheat that lets
#                                    the team capture without messages)
#   capture_k      : 4   -> 6       (need 6/10 within capture_radius; the
#                                    informed-agent-only solution stops
#                                    paying)
#   dist_coef      : 1.0 -> 0.1     (drop centroid-following reward by 10x
#                                    so the dense distance gradient stops
#                                    serving as an implicit broadcast)
#
# Hypothesis: under these three knobs the task should NEED messages.  The
# kill criterion for the homogeneous pursuit env is: attention vs
# attention_zm Delta on eval_capture remains ~0 (within seed noise) at
# alpha in {0.25, 0.5}.  If that happens, homogeneous-pursuit is
# structurally a dead end for the comm-necessity thesis question and we
# move to predator-capture-prey.
#
# Everything else is identical to pursuit_base.yaml so the 30-run cells
# are directly comparable to the big sweep cells at matching alphas.
#
# MODE A constraint: runtime.rollout_length == env.max_steps (both 100).
# Minibatch constraint: 100*32 % 1 == 0.

algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 2000000
  checkpoint_interval: 20
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

# Comm slot — overridden per-task by the sbatch.  Identity here is just
# the default for ad-hoc single runs from this YAML.
comm:
  module: "identity"
  topology: "knn"
  knn_k: 4
  symmetrize: "or"
  zero_messages: false

env:
  name: "pursuit"
  kind: "pursuit"
  num_agents: 10
  max_steps: 100
  include_timestep_in_state: true

  # Observation asymmetry knob (overridden per-task by the sbatch).
  alpha: 0.5
  num_full_sight: 0          # STIFFENED: no privileged full-sight agents
  observe_teammates: false   # isolation guarantee preserved

  # World geometry — identical to pursuit_base.yaml.
  world_size: 12.0
  capture_radius: 0.5
  capture_k: 6               # STIFFENED: was 4 (60% of team required)
  move_step: 0.2
  target_speed: 0.05

  # Reward coefficients.
  dist_coef: 0.1             # STIFFENED: was 1.0 (10x weaker centroid pull)
  step_penalty: 0.01
  capture_bonus: 10.0

  # Trainer diagnostics.
  primary_diagnostic: "pursuer_target_distance"
  secondary_diagnostic: "capture"
  task_score_kind: "pursuit"

logging:
  log_dir: "runs/pursuit_stiffened"
  run_label: "pursuit_stiffened_default"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 1
  save_checkpoints: true

render:
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
