# PP (homogeneous Predator-Prey) — v2 algo settings, comm-redundancy CONTROL for PCP.
#
# Homogeneous twin of PCP: all agents class-1 (num_full_sight=0), partial sight
# (alpha=0.5), moving prey, whole-team capture (capture_k=5). Expectation: comm is
# REDUNDANT here (agents can already see the prey), in contrast to PCP where comm is
# a structural precondition. Uses env.kind="pursuit" + existing PursuitAdapter (no new Python).
#
# Algo settings MATCH configs/pcp_smoke_v2.yaml (incl. entropy_coef_final=0.01 floor)
# so the PCP-vs-PP contrast is "identical backbone + training, different TASK structure".
#
# MODE A constraint: runtime.rollout_length == env.max_steps (both 100).

algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.01    # matches PCP-v2 entropy floor (symmetric conditions)
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 2000000
  checkpoint_interval: 20
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

# Comm slot — overridden per-cell by the sbatch sweep.
comm:
  module: "identity"
  topology: "knn"
  knn_k: 4
  symmetrize: "or"
  zero_messages: false

env:
  name: "pursuit"
  kind: "pursuit"
  num_agents: 5
  num_full_sight: 0           # homogeneous: no privileged full-sight agents
  alpha: 0.5                  # partial sight (agents CAN see prey within alpha*r_max)
  target_speed: 0.05          # moving prey
  max_steps: 100
  include_timestep_in_state: true

  observe_teammates: false

  world_size: 12.0
  capture_radius: 0.5
  capture_k: 5                # whole team must converge
  move_step: 0.2

  dist_coef: 1.0
  step_penalty: 0.01
  capture_bonus: 10.0

  primary_diagnostic: "pursuer_target_distance"
  secondary_diagnostic: "capture"
  task_score_kind: "pursuit"

logging:
  log_dir: "runs/pp_v2"
  run_label: "pp_v2_default"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 1
  save_checkpoints: true

render:
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
