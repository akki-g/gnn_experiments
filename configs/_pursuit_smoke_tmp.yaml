# TEMP learnability smoke config (alpha=1.0 symmetric). Not committed.
# 200 iters @ 32 envs * 100 steps = 640k env-steps. Verifies the pursuit task
# is learnable through the existing backbone (capture_rate / task_score should rise).
algo:
  name: "mappo"
  lr: 7.0e-4
  lr_final: 1.0e-5
  reward_shift: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  value_coef: 0.5
  max_grad_norm: 10.0
  ppo_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  share_encoder: true
  use_value_norm: true

runtime:
  rollout_length: 100
  num_envs: 32
  total_env_steps: 640000
  checkpoint_interval: 100000
  eval_interval: 20

model:
  hidden_dim: 64
  encoder_layers: 2
  actor_layers: 1
  critic_layers: 2

comm:
  module: "identity"

env:
  name: "pursuit"
  kind: "pursuit"
  num_agents: 3
  max_steps: 100
  include_timestep_in_state: true
  alpha: 1.0
  num_full_sight: 2
  observe_teammates: false
  world_size: 1.0
  capture_radius: 0.1
  move_step: 0.05
  target_speed: 0.03
  dist_coef: 1.0
  step_penalty: 0.01
  capture_bonus: 10.0
  primary_diagnostic: "pursuer_target_distance"
  secondary_diagnostic: "capture"
  task_score_kind: "pursuit"

logging:
  log_dir: "runs/pursuit_smoke"
  run_label: "smoke_alpha1"
  wandb: false
  wandb_project: "marl-thesis"
  console_log_interval: 10

render:
  mode: "off"
  eval_seed: 1000
  episodes: 2
  fps: 15
  frame_size: 512

seed: 0
device: "auto"
